services:
  postgres:
    image: postgres:16-alpine
    container_name: projecthub-db
    environment:
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    env_file: .env.docker

  postgres-notifications:
    image: postgres:16-alpine
    container_name: projecthub-notifications-db
    environment:
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NOTIFICATIONS}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_notifications_data:/var/lib/postgresql/data
    env_file: .env.docker

  postgres-auth:
    image: postgres:16-alpine
    container_name: projecthub-auth-db
    environment:
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_AUTH}
    ports:
      - "5434:5432"
    volumes:
      - ./postgres_auth_data:/var/lib/postgresql/data
    env_file: .env.docker

  redis:
    image: redis:7-alpine
    container_name: projecthub-cache
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: projecthub-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  workhub-gateway:
    image: 258227418027.dkr.ecr.ap-south-2.amazonaws.com/workhub-gateway
    ports:
      - "8080:8080"
    environment:
      - APP_JWT_SECRET=${APP_JWT_SECRET}
    depends_on:
      - workhub-core
      - workhub-auth
      - workhub-notifications
    env_file: .env.docker

  workhub-core:
    image: 258227418027.dkr.ecr.ap-south-2.amazonaws.com/workhub-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./core-uploads:/app/uploads
    depends_on:
      - postgres
      - rabbitmq
      - redis
    env_file: .env.docker

  workhub-auth:
    image: 258227418027.dkr.ecr.ap-south-2.amazonaws.com/workhub-auth
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_AUTH}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${APP_JWT_SECRET}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      - postgres-auth
      - rabbitmq
    env_file: .env.docker

  workhub-notifications:
    image: 258227418027.dkr.ecr.ap-south-2.amazonaws.com/workhub-notifications
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL_NOTIFICATIONS=${SPRING_DATASOURCE_URL_NOTIFICATIONS}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      - postgres-notifications
      - rabbitmq
    env_file: .env.docker
