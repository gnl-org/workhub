

# core-service doesn't manage users — GatewayTokenFilter reads X-User-Id from gateway
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# spring.profiles.active=dev, seed
spring.profiles.active=dev, swagger
#spring.profiles.active=dev

# Rate limiting defaults (overridden by profile-specific files)
rate-limit.capacity=25
rate-limit.refill-tokens=25
rate-limit.refill-duration-minutes=1

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
