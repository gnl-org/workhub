server.port=8081

spring.application.name=coreservice

# Docker Local DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate validates schema only, Flyway manages all changes
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.properties.hibernate.format_sql=true

# Force Spring Security to tell you exactly who it rejects and why
# logging.level.org.springframework.security=TRACE
# Force Hibernate to show exactly what transaction states are committing
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway manages schema - baseline represents current V1 schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial schema from V1__init_schema.sql

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Hard cap the database connection pool to just 2 connections
spring.datasource.hikari.maximum-pool-size=2

# How long a thread will wait for a connection before throwing an exception (in ms)
spring.datasource.hikari.connection-timeout=2000
# logging.level.com.zaxxer.hikari=DEBUG

# ==========================================
# Redis & Caching Configuration
# ==========================================
# Point to your Dockerized Redis process on localhost
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Set Redis as the primary cache provider
spring.cache.type=redis

# ==========================================
# Rate limiting
rate-limit.capacity=100
rate-limit.refill-tokens=100
rate-limit.refill-duration-minutes=1

# error controller should never leak raw messages or stack traces
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==========================================
# File Upload Storage
# ==========================================
# app.storage.provider=local
app.storage.provider=s3
app.storage.upload-dir=./uploads
app.storage.s3.bucket=workhub-uploads
app.storage.s3.region=ap-south-2
# app.storage.s3.endpoint=
# app.storage.s3.access-key=
# app.storage.s3.secret-key=

# ==========================================
# RabbitMQ Connection Config
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
