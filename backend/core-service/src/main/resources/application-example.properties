spring.application.name=coreservice

# Docker Local DB
spring.datasource.url=JDBC_CONNECTION_STRING
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate validates schema only, Flyway manages all changes
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

# Flyway manages schema - baseline represents current V1 schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial schema from V1__init_schema.sql

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==========================================
# Redis & Caching Configuration
# ==========================================
# Point to your Dockerized Redis process on localhost
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Set Redis as the primary cache provider
spring.cache.type=redis

# ==========================================
# Rate limiting (requests per minute per IP on auth endpoints)
rate-limit.capacity=RATE_LIMIT_CAPACITY
rate-limit.refill-tokens=RATE_LIMIT_REFILL_TOKENS
rate-limit.refill-duration-minutes=1

# ==========================================
# RabbitMQ Connection Config
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# error controller should never leak raw messages or stack traces
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never