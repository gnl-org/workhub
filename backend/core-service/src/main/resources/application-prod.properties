spring.application.name=coreservice

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate validates schema only, Flyway manages all changes
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

# Flyway manages schema - baseline represents current V1 schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial schema from V1__init_schema.sql

# Jwt
app.jwt.secret=${APP_JWT_SECRET}
# Access Token: 15 minutes in milliseconds
app.jwt.expiration=900000
# Refresh Token: 24 hours in milliseconds (stateless, no DB storage)
app.jwt.refresh-expiration=86400000

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==========================================
# Redis & Caching Configuration
# ==========================================
# Point to your Dockerized Redis process on localhost
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Set Redis as the primary cache provider
spring.cache.type=redis

# ==========================================
# ==========================================
# RabbitMQ Connection Config
# ==========================================
# Points to Docker service name 'rabbitmq'
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Rate limiting
rate-limit.capacity=25
rate-limit.refill-tokens=25
rate-limit.refill-duration-minutes=1

# error controller should never leak raw messages or stack traces
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never