server.port=8081

spring.application.name=coreservice

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate validates schema only, Flyway manages all changes
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.properties.hibernate.format_sql=true

# Flyway manages schema - baseline represents current V1 schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial schema from V1__init_schema.sql

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==========================================
# Redis & Caching Configuration
# ==========================================
# Point to your Dockerized Redis process on localhost
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Set Redis as the primary cache provider
# spring.cache.type=redis

# Redis is not available in this environment; disable auto-config so
# Spring does not attempt to create a LettuceConnectionFactory at startup.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ==========================================
# File Upload Storage
# ==========================================
app.storage.upload-dir=./uploads
app.storage.provider=s3
app.storage.s3.bucket=workhub-uploads
app.storage.s3.region=ap-south-2

# ==========================================
# ==========================================
# RabbitMQ Connection Config
# ==========================================
# Points to Docker service name 'rabbitmq'
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Rate limiting
rate-limit.capacity=25
rate-limit.refill-tokens=25
rate-limit.refill-duration-minutes=1

# error controller should never leak raw messages or stack traces
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never