spring.application.name=backend

# Docker Local DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate validates schema only, Flyway manages all changes
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

# Flyway manages schema - baseline represents current V1 schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial schema from V1__init_schema.sql

# Jwt
app.jwt.secret=${APP_JWT_SECRET}
# Access Token: 15 minutes in milliseconds
app.jwt.expiration=900000
# Refresh Token: 24 hours in milliseconds (stateless, no DB storage)
app.jwt.refresh-expiration=86400000

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Hard cap the database connection pool to just 2 connections
spring.datasource.hikari.maximum-pool-size=2

# How long a thread will wait for a connection before throwing an exception (in ms)
spring.datasource.hikari.connection-timeout=2000
# logging.level.com.zaxxer.hikari=DEBUG

# ==========================================
# Redis & Caching Configuration
# ==========================================
# Point to your Dockerized Redis process on localhost
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Set Redis as the primary cache provider
spring.cache.type=redis

# ==========================================
# error controller should never leak raw messages or stack traces
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never