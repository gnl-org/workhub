spring.application.name=notificationservice

spring.datasource.url=${SPRING_DATASOURCE_URL_NOTIFICATIONS}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

server.port=8083

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==========================================
# Actuator (Production Restriction)
# ==========================================
# SECURITY: In production, only expose health checks.
# Do NOT expose /actuator/prometheus or /actuator/metrics publicly —
# they leak JVM internals, request rates, and memory details.
# For Prometheus scraping, use network-level security (Docker network, VPC, or IP whitelist).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
