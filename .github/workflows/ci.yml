name: CI
on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2
  ECR_REGISTRY: 258227418027.dkr.ecr.ap-south-2.amazonaws.com

jobs:
  test:
    strategy:
      matrix:
        service:
          - core-service
          - gateway-service
          - auth-service
          - notification-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: mvn test

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  build-and-push:
    needs: test
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - service: core-service
            ecr_repo: workhub-backend
          - service: gateway-service
            ecr_repo: workhub-gateway
          - service: auth-service
            ecr_repo: workhub-auth
          - service: notification-service
            ecr_repo: workhub-notifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Package JAR
        working-directory: backend/${{ matrix.service }}
        run: mvn package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::258227418027:role/workhub_ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repo exists
        run: |
          aws ecr describe-repositories --repository-names ${{ matrix.ecr_repo }} 2>/dev/null ||
          aws ecr create-repository --repository-name ${{ matrix.ecr_repo }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: backend/${{ matrix.service }}
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Push to ECR
        run: docker push --all-tags ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}
